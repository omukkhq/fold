repos:
  - repo: local
    hooks:
      - id: rust
        name: rust
        language: system
        pass_filenames: true
        require_serial: true
        files: '(\.rs$|(^|/)Cargo\.toml$|(^|/)Cargo\.lock$|(^|/)rust-toolchain\.toml$|(^|/)clippy\.toml$|(^|/)\.sqlx/|(^|/)migrations/)'
        entry: scripts/hook-rust.sh
      - id: web
        name: web
        language: system
        pass_filenames: false
        files: '^web/'
        entry: make --no-print-directory fmt-check-web test-web
