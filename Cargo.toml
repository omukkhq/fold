[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.98.0"
publish = false

[workspace.lints.rust]
unsafe_code = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# Checks, tests and coverage build with this profile, and the test profile inherits it. Every worktree builds into one shared cargo target directory, so incremental data for each fold crate and test binary would be stored once per worktree and fill the disk. Line tables keep file and line numbers in backtraces at a fraction of the size and link time of full debug info. Dependencies stay at opt-level 0: optimizing them makes a build from empty more than twice as long and the build folder larger, and the test run is no faster because the slowest tests run fold code.
[profile.dev]
incremental = false
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The bench builds the daemon optimised but without link-time optimisation, which would make every change to a bench wait minutes for a link.
[profile.bench]
inherits = "release"
lto = false
codegen-units = 16

[profile.release]
lto = true
codegen-units = 1
strip = true
