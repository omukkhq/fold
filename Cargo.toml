[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
publish = false

[workspace.lints.rust]
unsafe_code = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# Every worktree builds into one shared cargo target directory, so incremental data for each fold crate and test binary would be stored once per worktree and fill the disk. The test profile inherits this setting.
[profile.dev]
incremental = false

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.ci]
inherits = "release"
lto = false
