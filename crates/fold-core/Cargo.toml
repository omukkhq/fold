[package]
name = "fold-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[dependencies]
base64 = "0.22.1"
blake3 = "1.8.7"
hmac = "0.13.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
similar = "3.2.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
toml = "1.1.8"

[lints]
workspace = true

[dev-dependencies]
proptest = "1.12.0"

[[test]]
name = "integration"
path = "tests/main.rs"
