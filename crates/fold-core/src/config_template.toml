# How many minutes a claim lasts without a heartbeat before it expires.
# lease_minutes = 30
# How many milliseconds the watcher waits after a file change before it scans.
# debounce_ms = 500
# How many seconds pass between full workspace rescans.
# rescan_seconds = 60
# How many quiet seconds pass before a workspace gets an automatic checkpoint.
# auto_checkpoint_quiet_seconds = 120
# How many automatic checkpoints each workspace keeps.
# auto_checkpoints_kept = 20
# The largest file size in bytes that fold tracks.
# max_file_bytes = 52428800
# How many minutes without activity before a claimed task counts as stalled.
# stall_minutes = 5
# How many days a closed workspace directory stays before garbage collection.
# closed_workspace_days = 14
# The project's Git history: every integration becomes a commit on this branch of the project folder's repository .git, which the folder has checked out.
# [git]
# branch = "main"
# The remote Git repositories that `fld push` and `fld pull` use have one `[remotes.<name>]` section each, with the keys `url`, `branch` and `push_on_integrate`. `fld remote set <name> <url> [<branch>]` writes it, and no remote exists by default.
# What fold does with a proposal that is ready to integrate.
# [integration]
# Whether fold integrates a ready proposal by itself: the review lead, a batch reviewer, the main agent or a human approved it, nothing asks for changes, a human approved it when the task is marked for human review, and every prerequisite task is Done. With false, one of those agents or a human integrates it.
# automatic = true
# The short-lived worker agents fold starts and supervises: at most `task_coder` task coders and at most `batch_reviewer` batch reviewers run at a time. The area leads and the review lead are outside these limits. The key `max_per_area` also limits the task coders of one area; without it an area has no limit of its own. A limit has no upper bound, and 0 lets no worker of its role start.
# [workers]
# task_coder = 4
# batch_reviewer = 3
# Each worker role can have a `[roles.<role>]` section, for area_lead, review_lead, task_coder or batch_reviewer, with the keys `model` (passed to Claude Code as `--model`), `cache_ttl` ("1h" or "5m"; "1h" for leads and batch reviewers and "5m" for task coders by default), `idle_minutes` (task_coder and batch_reviewer only; 15 by default), `handoff_at` (area_lead and review_lead only; the percent of the model's context window past which fold asks the lead for a hand-off note and starts it again with a fresh context; 60 by default) and `mcp`, a list of server names, `fold` and servers of the project's `.mcp.json`, that limits the role to those servers. A role's prompt is `.fold/roles/<role>.md` when that file exists, else the prompt that ships with fold; fold adds its shared authority and recovery rules after either.
