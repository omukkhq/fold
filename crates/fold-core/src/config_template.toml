# How many minutes a claim lasts without a heartbeat before it expires.
# lease_minutes = 30
# How many milliseconds the watcher waits after a file change before it scans.
# debounce_ms = 500
# How many seconds pass between full workspace rescans.
# rescan_seconds = 60
# How many quiet seconds pass before a workspace gets an automatic checkpoint.
# auto_checkpoint_quiet_seconds = 120
# How many automatic checkpoints each workspace keeps.
# auto_checkpoints_kept = 20
# The largest file size in bytes that fold tracks.
# max_file_bytes = 52428800
# How many minutes without activity before a claimed task counts as stalled.
# stall_minutes = 5
# How many days a closed workspace directory stays before garbage collection.
# closed_workspace_days = 14
# The project's Git history: every integration becomes a commit on this branch of the project folder's repository .git, which the folder has checked out.
# [git]
# branch = "main"
# The remote Git repositories that `fld push` and `fld pull` use have one `[remotes.<name>]` section each, with the keys `url`, `branch` and `push_on_integrate`. `fld remote set <name> <url> [<branch>]` writes it, and no remote exists by default.
# What fold does with a proposal that is ready to integrate.
# [integration]
# Whether fold integrates a ready proposal by itself: an integrator agent approved it, nothing asks for changes, a human approved it after the agent when the task is marked for human review, and every prerequisite task is Done. With false, an integrator or a human integrates it.
# automatic = true
# The worker agents fold starts and supervises: at most `max` run at a time in the project, and at most `max_per_area` in one area.
# [workers]
# max = 3
# max_per_area = 2
# Each worker role can have a `[roles.<role>]` section, for area_lead, review_lead, task_coder or batch_reviewer, with the keys `model` (passed to Claude Code as `--model`), `cache_ttl` ("1h" or "5m"; "1h" for leads and batch reviewers and "5m" for task coders by default), `idle_minutes` (task_coder and batch_reviewer only; 15 by default) and `mcp`, a list of server names, `fold` and servers of the project's `.mcp.json`, that limits the role to those servers. A role's prompt is `.fold/roles/<role>.md` when that file exists, else the prompt that ships with fold.
