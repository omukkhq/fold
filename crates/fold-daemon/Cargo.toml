[package]
name = "fold-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
fold-core = { version = "0.1.0", path = "../fold-core" }
fold-store = { version = "0.1.0", path = "../fold-store" }
fold-vcs = { version = "0.1.0", path = "../fold-vcs" }
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "http1", "service"] }
rustix = { version = "1.1.5", features = ["net", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
utoipa = "6.0.0"
utoipa-axum = "0.3.0"

[lints]
workspace = true

[dev-dependencies]
fold-store = { path = "../fold-store", features = ["testing"] }
http-body-util = "0.1.5"
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio"] }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time"] }
tower = { version = "0.5.3", features = ["util"] }
