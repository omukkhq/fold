[package]
name = "fold-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
blake3 = "1.8.7"
fail = { version = "0.5.1", optional = true }
fold-core = { version = "0.2.1", path = "../fold-core" }
fold-store = { version = "0.2.1", path = "../fold-store" }
fold-vcs = { version = "0.2.1", path = "../fold-vcs" }
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.4.3"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "http1", "service"] }
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-async-rw"] }
rust-embed = "8.13.0"
rustix = { version = "1.1.5", features = ["fs", "net", "process", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml_edit = "0.25.17"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
utoipa = "6.0.0"
utoipa-axum = "0.3.0"

[lints]
workspace = true

[dev-dependencies]
fail = "0.5.1"
fold-store = { path = "../fold-store", features = ["testing"] }
http-body-util = "0.1.5"
rmcp = { version = "3.5.1", features = ["client"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio"] }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "test-util"] }
tower = { version = "0.5.3", features = ["util"] }
tracing-subscriber = "0.3.23"

[features]
# Compiles the failpoints that crash-safety tests fire; release builds leave it off.
failpoints = ["dep:fail", "fail/failpoints", "fold-vcs/failpoints"]
# Lets a project with a `.fold/dev-stub/` folder run fld's scripted stand-in for Claude Code instead of `claude`, for the development seed; release builds leave it off.
dev-launcher = []

[[test]]
name = "integration"
path = "tests/main.rs"
