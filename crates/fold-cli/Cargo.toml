[package]
name = "fold-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "fold"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
fold-core = { version = "0.1.0", path = "../fold-core" }
fold-daemon = { version = "0.1.0", path = "../fold-daemon" }
fold-vcs = { version = "0.1.0", path = "../fold-vcs" }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
rmcp = { version = "3.5.1", features = ["client"], optional = true }
rustix = { version = "1.1.5", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "rt", "io-std"] }
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

[lints]
workspace = true

[dev-dependencies]
axum = "0.8.9"
fold-store = { path = "../fold-store", features = ["testing"] }
rmcp = { version = "3.5.1", features = ["client"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "process"] }
tower = { version = "0.5.3", features = ["util"] }

[features]
# A `fold serve` built with it reads `FAILPOINTS`, so a crash test can stop the real daemon inside a command.
failpoints = ["fold-daemon/failpoints"]
dev-seed = ["dep:rmcp"]

[[test]]
name = "crash_sigkill"
required-features = ["failpoints"]
