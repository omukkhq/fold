[package]
name = "fold-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[[bin]]
name = "fld"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
fold-core = { version = "0.5.2", path = "../fold-core" }
fold-daemon = { version = "0.5.2", path = "../fold-daemon" }
fold-vcs = { version = "0.5.2", path = "../fold-vcs" }
getrandom = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
rmcp = { version = "3.5.1", features = ["client"], optional = true }
rustix = { version = "1.1.5", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "runtime-tokio", "sqlite"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "rt", "io-std", "process"] }
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[lints]
workspace = true

[dev-dependencies]
axum = "0.8.9"
fold-store = { path = "../fold-store", features = ["testing"] }
rmcp = { version = "3.5.1", features = ["client"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "process"] }
tower = { version = "0.5.3", features = ["util"] }

[features]
# A `fld serve` built with it reads `FAILPOINTS`, so a crash test can stop the real daemon inside a command.
failpoints = ["fold-daemon/failpoints"]
dev-seed = ["dep:rmcp", "fold-daemon/dev-launcher"]

[[test]]
name = "integration"
path = "tests/main.rs"

[[bench]]
name = "budgets"
harness = false
