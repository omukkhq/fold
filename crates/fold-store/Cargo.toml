[package]
name = "fold-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[dependencies]
fold-core = { version = "0.5.2", path = "../fold-core" }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tempfile = { version = "3.27.0", optional = true }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
fold-store = { path = ".", features = ["testing"] }

[features]
testing = ["dep:tempfile"]

[[test]]
name = "integration"
path = "tests/main.rs"
