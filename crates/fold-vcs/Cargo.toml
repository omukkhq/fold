[package]
name = "fold-vcs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autotests = false

[dependencies]
blake3 = "1.8.7"
fail = { version = "0.5.1", optional = true }
fold-core = { version = "0.2.0", path = "../fold-core" }
ignore = "0.4.33"
notify = "8.2.0"
rustix = { version = "1.1.5", features = ["fs"] }
serde_json = "1.0.154"
similar = "3.2.0"
thiserror = "2.0.21"
tracing = "0.1.44"
zstd = "0.14.2"

[lints]
workspace = true

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
libc = "0.2.190"

[features]
# Compiles the failpoints that crash-safety tests fire; release builds leave it off.
failpoints = ["dep:fail", "fail/failpoints"]

[[test]]
name = "integration"
path = "tests/main.rs"
